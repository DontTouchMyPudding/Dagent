[project]
name = "agent-project"
version = "0.1.0"
description = "Agent chat backend (FastAPI + LangChain)"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "asyncmy>=0.2.11",
    "chromadb>=1.5.9",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.1.0",
    "langchain-milvus>=0.4.0",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "milvus-lite>=3.0",
    "openai>=2.37.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.24",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
